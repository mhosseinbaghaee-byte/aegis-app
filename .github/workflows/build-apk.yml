name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI and expect
        run: |
          npm install -g @bubblewrap/cli
          sudo apt-get update -y && sudo apt-get install -y expect

      - name: Configure Bubblewrap paths
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json << EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

      - name: Pre-generate signing keystore (avoid fragile interactive wizard)
        run: |
          mkdir -p android-build
          cd android-build
          keytool -genkeypair -v -keystore android.keystore -alias androidkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass password123 -keypass password123 \
            -dname "CN=Aegis Developer, OU=Aegis, O=Aegis, L=Tehran, S=Tehran, C=IR"
          ls -la android.keystore

      - name: Init APK project with Bubblewrap (silence-based)
        id: init
        continue-on-error: true
        timeout-minutes: 10
        run: |
          cd android-build
          cat > init.exp << 'EOF'
          #!/usr/bin/expect -f
          # استراتژی: هر پرامپت شناخته‌شده (پسورد، تاییدیه) رو دقیق جواب می‌ده.
          # هر چیز ناشناخته‌ای که ۸ ثانیه ساکت بمونه رو به‌عنوان "پرامپت با پیش‌فرض" در نظر می‌گیره و Enter می‌زنه.
          set timeout 8
          log_user 1
          set counter 0
          set max_steps 80

          spawn bubblewrap init --manifest https://mhosseinbaghaee-byte.github.io/aegis-app/manifest.json

          expect {
            -re "(?i)regenerate.*\\(Y/n\\)" {
              incr counter
              send "no\r"; exp_continue
            }
            -re "(?i)assword" {
              incr counter
              send "password123\r"; exp_continue
            }
            -re "(?i)country code" {
              incr counter
              send "IR\r"; exp_continue
            }
            -re "(?i)first and last name" {
              incr counter
              send "Aegis Developer\r"; exp_continue
            }
            -re "(?i)organizational unit" {
              incr counter
              send "Aegis\r"; exp_continue
            }
            -re "(?i)name of your organization" {
              incr counter
              send "Aegis\r"; exp_continue
            }
            -re "(?i)city or locality" {
              incr counter
              send "Tehran\r"; exp_continue
            }
            -re "(?i)state or province" {
              incr counter
              send "Tehran\r"; exp_continue
            }
            timeout {
              incr counter
              if {$counter > $max_steps} {
                puts "LOOP_GUARD_TRIGGERED after $counter steps"
                exit 2
              }
              send "\r"
              exp_continue
            }
            eof { puts "REACHED_EOF_NORMALLY after $counter steps" }
          }
          EOF
          chmod +x init.exp
          ./init.exp 2>&1 | tee ../build-output.log
          echo "EXIT_CODE_OF_EXPECT: ${PIPESTATUS[0]}" | tee -a ../build-output.log
          echo "--- ls after init ---" | tee -a ../build-output.log
          ls -la | tee -a ../build-output.log

      - name: Commit progress log (checkpoint 1)
        if: always()
        run: |
          git config user.name "aegis-bot"
          git config user.email "bot@aegis.local"
          git add build-output.log
          git commit -m "checkpoint: init log [skip ci]" || echo "nothing to commit"
          git push || echo "push failed"

      - name: Verify APK was built and signed by bubblewrap
        if: always()
        run: |
          echo "--- searching for apk produced by bubblewrap init ---"
          find . -iname "*.apk" -not -path "*/node_modules/*" || true

      - name: List output files
        if: always()
        run: find . -maxdepth 4 -iname "*.apk" -o -iname "*.aab" || true

      - name: Commit final build log and APK
        if: always()
        run: |
          git config user.name "aegis-bot"
          git config user.email "bot@aegis.local"
          echo "--- searching for apk candidates ---"
          find . -iname "*.apk" -not -path "*/node_modules/*"
          FOUND_SIGNED=""
          while IFS= read -r candidate; do
            if unzip -l "$candidate" | grep -qi "META-INF/.*\.RSA\|META-INF/.*\.DSA\|META-INF/.*\.EC"; then
              echo "signed candidate: $candidate"
              FOUND_SIGNED="$candidate"
              break
            else
              echo "unsigned (skipping): $candidate"
            fi
          done < <(find . -iname "*.apk" -not -path "*/node_modules/*")

          if [ -n "$FOUND_SIGNED" ]; then
            cp "$FOUND_SIGNED" ./aegis-release.apk
            git add -f aegis-release.apk
            echo "SIGNATURE_OK: $FOUND_SIGNED" | tee -a build-output.log
          else
            echo "SIGNATURE_MISSING_ON_ALL_CANDIDATES - refusing to publish an unsigned APK" | tee -a build-output.log
          fi
          git add build-output.log
          git commit -m "Final build log + APK [skip ci]" || echo "nothing to commit"
          git push || echo "push failed"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-apk
          path: |
            **/*.apk
            **/*.aab
          if-no-files-found: warn
