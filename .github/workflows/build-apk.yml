name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap paths
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json << EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF
          cat ~/.bubblewrap/config.json

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v -keystore android.keystore -alias androidkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass password123 -keypass password123 \
            -dname "CN=Aegis, OU=Aegis, O=Aegis, L=Tehran, S=Tehran, C=IR"

      - name: Build APK with Bubblewrap
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          printf "password123\npassword123\npassword123\npassword123\n" | bubblewrap build 2>&1 | tee build-output.log

      - name: List output files
        run: find . -maxdepth 2 -iname "*.apk" -o -iname "*.aab" || true

      - name: Commit build log back to repo
        if: always()
        run: |
          git config user.name "aegis-bot"
          git config user.email "bot@aegis.local"
          git add build-output.log
          git commit -m "Add build log [skip ci]" || echo "nothing to commit"
          git push || echo "push failed"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-apk
          path: |
            *.apk
            *.aab
          if-no-files-found: warn
