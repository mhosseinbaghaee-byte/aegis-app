name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI and expect
        run: |
          npm install -g @bubblewrap/cli
          sudo apt-get update -y && sudo apt-get install -y expect

      - name: Configure Bubblewrap paths
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json << EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

      - name: Init + Build APK with Bubblewrap (fully automated)
        id: build
        continue-on-error: true
        run: |
          mkdir -p android-build
          cd android-build
          cat > init.exp << 'EOF'
          #!/usr/bin/expect -f
          set timeout 900
          log_user 1
          spawn bubblewrap init --manifest https://mhosseinbaghaee-byte.github.io/aegis-app/manifest.json
          expect {
            -re "(?i)regenerate.*\\(Y/n\\)" { send "no\r"; exp_continue }
            -re "(?i)assword" { send "password123\r"; exp_continue }
            -re "(?i)country code" { send "IR\r"; exp_continue }
            -re "(?i)state or province" { send "Tehran\r"; exp_continue }
            -re "(?i)city or locality" { send "Tehran\r"; exp_continue }
            -re "(?i)organization\\b" { send "Aegis\r"; exp_continue }
            -re "(?i)organizational unit" { send "Aegis\r"; exp_continue }
            -re "(?i)first and last name" { send "Aegis\r"; exp_continue }
            -re "(?i)correct.*\\(y/n\\)" { send "yes\r"; exp_continue }
            -re "\\? " { send "\r"; exp_continue }
            timeout { puts "TIMEOUT - no more prompts matched"; exit 1 }
            eof
          }
          EOF
          chmod +x init.exp
          ./init.exp 2>&1 | tee ../build-output.log
          echo "--- checking for gradlew ---"
          ls -la
          if [ -f "./gradlew" ]; then
            echo "gradlew found, building release APK directly"
            ./gradlew assembleRelease --stacktrace 2>&1 | tee -a ../build-output.log
          fi

      - name: List output files
        run: find . -maxdepth 4 -iname "*.apk" -o -iname "*.aab" || true

      - name: Commit build log back to repo
        if: always()
        run: |
          git config user.name "aegis-bot"
          git config user.email "bot@aegis.local"
          git add build-output.log
          git commit -m "Add build log [skip ci]" || echo "nothing to commit"
          git push || echo "push failed"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-apk
          path: |
            **/*.apk
            **/*.aab
          if-no-files-found: warn
